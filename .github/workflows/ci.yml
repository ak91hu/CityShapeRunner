name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev,all]"

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy --ignore-missing-imports gps_art_wizzard

      - name: Run unit and integration tests
        env:
          GEOCODE_OFFLINE: "1"
        run: python -m pytest -q

  frontend:
    name: Node 24 and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run functional UI tests
        run: npm run test:e2e

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Northflank production image
        run: docker build --tag gps-art-wizard:${{ github.sha }} .
