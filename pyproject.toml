[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-art-wizzard"
version = "0.1.0"
description = "GPS art route planner that generates and validates GPX-exportable shape candidates for real street networks."
readme = "docs/README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "GPS Art Wizard" }]
dependencies = [
    "fastapi==0.140.8",
    "uvicorn[standard]==0.51.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "numpy==2.5.1",
    "shapely==2.1.2",
    "gpxpy==1.6.2",
    "python-dotenv==1.2.2",
    "pillow==12.3.0",
    "svgelements==1.9.6",
]

[project.optional-dependencies]
openai = ["openai==2.49.0"]
anthropic = ["anthropic==0.120.0"]
opencode = ["openai==2.49.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
]
all = ["openai==2.49.0", "anthropic==0.120.0"]

[project.scripts]
gps-art-wizzard = "gps_art_wizzard.main:run"

[tool.setuptools.packages.find]
include = ["gps_art_wizzard*"]

[tool.setuptools.package-data]
"gps_art_wizzard.prompts" = ["*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers", "--basetemp=.pytest-tmp"]
testpaths = ["tests"]
