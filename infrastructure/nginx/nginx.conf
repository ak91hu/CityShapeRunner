worker_processes 1;

events { worker_connections 1024; }

http {
    upstream api { server api:8000; }
    upstream web { server web:3000; }

    server {
        listen 80;

        location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
        location /assets/ { proxy_pass http://api; }
        location / { proxy_pass http://web; proxy_set_header Host $host; }
    }
}
