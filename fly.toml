# fly.toml — CityShapeRunner API
app = "cityshaperunner-api"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[env]
  CSR_PUBLIC_WEB_URL = "https://cityshaperunner-web.fly.dev"
  CSR_API_BASE_URL = "https://cityshaperunner-api.fly.dev"
  CSR_DATA_DIR = "/data"

[mounts]
  source = "cityshaperunner_cache"
  destination = "/data/cache"
