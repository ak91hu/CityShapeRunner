# fly.toml app configuration file generated for cityshaperunner on 2026-07-08T13:35:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cityshaperunner'
primary_region = 'fra'

[build]

[env]
  CSR_API_BASE_URL = 'https://cityshaperunner-api.fly.dev'
  CSR_PUBLIC_WEB_URL = 'https://cityshaperunner-web.fly.dev'

[[mounts]]
  source = 'cityshaperunner_cache'
  destination = '/app/data/cache'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
