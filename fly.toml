app = "cityshaperunner"
primary_region = "ams"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[env]
  CSR_PUBLIC_WEB_URL = "https://cityshaperunner.fly.dev"
  CSR_API_BASE_URL = "https://cityshaperunner.fly.dev"

[mounts]
  source = "cityshaperunner_cache"
  destination = "/app/data/cache"
