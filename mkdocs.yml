site_name: Paceasso | GPS Art Wizzard
site_description: Architecture, algorithms, API, operations, and engineering documentation for Paceasso, the GPS Art Wizzard.
site_url: https://ak91hu.github.io/CityShapeRunner/
repo_url: https://github.com/ak91hu/CityShapeRunner
repo_name: ak91hu/CityShapeRunner
edit_uri: edit/master/docs/
copyright: Paceasso technical documentation

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Start here:
      - Developer quick start: guides/getting-started.md
      - Complete project guide: guides/project-overview.md
      - Repository guide: architecture/agents.md
  - Architecture:
      - System architecture: architecture/overview.md
      - Implementation guide:
          - Engineering overview: architecture/implementation/index.md
          - Backend route pipeline: architecture/implementation/backend-pipeline.md
          - State and quality model: architecture/implementation/data-and-quality.md
          - Frontend implementation: architecture/implementation/frontend.md
          - Runtime and reliability: architecture/implementation/runtime-reliability.md
      - AI shape pipeline: architecture/ai-shape-pipeline.md
      - Production AI workflow: architecture/ai-workflow.md
      - Custom shape generation: architecture/custom-shape-generation.md
      - GPS-art intelligence: guides/gps-art-intelligence.md
      - Shape-template uniqueness: skills/shape-template-uniqueness.md
  - Reference:
      - HTTP API: reference/api-reference.md
      - External API integrations: reference/external-apis.md
      - Configuration: reference/configuration-reference.md
      - Hungarian shape catalog: reference/hungarian-shape-catalog.md
      - City and shape recommendations: guides/city-shape-recommendations.md
      - Balaton city coverage: guides/balaton-city-coverage.md
  - Quality and operations:
      - Development and review workflow: development/workflow.md
      - Testing: development/testing.md
      - CI/CD and documentation: operations/ci-cd.md
      - Production deployment: operations/deployment.md
      - Production gallery testing: operations/production-gallery-testing.md
      - Cloudinary gallery plan: design/cloudinary-map-gallery-plan.md
      - UI/UX rationale: design/ui-ux-rationale.md
      - UI design history: design/ui-design.md
  - Algorithms and research:
      - Algorithmic background: architecture/algorithmic-background.md
      - GPS-art research: research/gps-art-research.md
      - Generation review (2026-10-19): research/2026-10-19-generation-review.md
      - Niche positioning (2026-08): research/niche-positioning-2026-08.md
      - Route preview provenance: research/budapest-heart-route.md
  - Reports:
      - Placement comparison (2026-10-19): reports/2026-10-19-creative-fit.md
      - Code quality review (2026-10-19): reports/2026-10-19-code-quality.md
      - Usability audit (2026-10-19): reports/2026-10-19-usability.md
      - Algorithm audit (2026-08): reports/gps-art-algorithm-audit-2026-08.md
      - Generation improvements (2026-09): reports/generation-development.md
      - Lessons learned (2026-07-30): reports/2026-07-30-lessons-learned.md
      - Regression report (2026-09-02): reports/2026-09-02-test-report.md
  - Agent skills:
      - Planning: skills/skill-planning.md
      - Prompt engineering: skills/skill-prompt-engineering.md
      - Shape design: skills/skill-shape-design.md
      - Route placement: skills/skill-route-placement.md
      - Street snapping: skills/skill-snap-and-roads.md
      - Refinement heuristics: skills/skill-refinement-heuristics.md
      - Validation metrics: skills/skill-validation-metrics.md

plugins:
  - search:
      lang: en

hooks:
  - scripts/check_documentation.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ak91hu/CityShapeRunner
      name: Paceasso on GitHub
