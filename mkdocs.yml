site_name: CityShapeRunner
site_description: GPS art generation platform - SVG shape matching to real streets
site_url: https://github.com/anon/PathForge
repo_url: https://github.com/anon/PathForge
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/map-marker-path

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.details
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - API reference: api.md
  - Shape matching algorithm: algorithm.md
  - Full specification: specification.md
  - Development: development.md
  - Deployment: deployment.md
  - Frontend: frontend.md
