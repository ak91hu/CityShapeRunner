# fly.toml — CityShapeRunner Web (Next.js)
app = "cityshaperunner-web"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NEXT_PUBLIC_API_BASE_URL = "https://cityshaperunner-api.fly.dev"
